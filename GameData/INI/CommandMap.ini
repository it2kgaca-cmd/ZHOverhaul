; Send selected free builders to the nearest abandoned construction sites.
CommandMap RESUME_NEAREST_CONSTRUCTION
  Key = KEY_B
  Transition = DOWN
  Modifiers = SHIFT_CTRL
  UseableIn = GAME
End


; Intelligently distribute selected units into compatible transports and garrisons.
CommandMap SMART_LOAD
  Key = KEY_L
  Transition = DOWN
  Modifiers = CTRL
  UseableIn = GAME
End
